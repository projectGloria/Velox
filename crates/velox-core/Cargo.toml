[package]
name = "velox-core"
description = "Velox indexing and search engine: NTFS MFT reader, in-memory name index, query engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "velox_core"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
memchr = "2.7"
arc-swap = "1.7"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Security",
]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "query"
harness = false

[[bench]]
name = "build"
harness = false
